name: Codex Image

on:
  push:
    tags:
      - "codex-v0.171.0"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reject an existing version tag
        run: |
          if docker buildx imagetools inspect ghcr.io/hoangndst/buddy-sandboxes-codex:0.171.0 >/dev/null 2>&1; then
            echo "Codex image tag 0.171.0 already exists; version tags are immutable."
            exit 1
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: images/codex/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/hoangndst/buddy-sandboxes-codex:0.171.0
