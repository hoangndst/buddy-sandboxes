name: Tests

on:
  push:
    paths-ignore:
      - "site/**"
  pull_request:
    paths-ignore:
      - "site/**"

jobs:
  test:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Running Tests
        run: |
          go mod tidy
          make test

  workstation:
    name: Workstation tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run workstation package tests
        run: go test -v ./internal/workspace ./pkg/client ./cmd/buddy-sbx

      - name: Build buddy-sbx CLI
        run: go build ./cmd/buddy-sbx

