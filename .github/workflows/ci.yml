name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.170.1"
          extended: true

      - name: Verify Manifests and Code Generation
        run: |
          make manifests generate
          git status --porcelain
          git diff --exit-code

      - name: Lint and Vet
        run: |
          make fmt vet

      - name: Run Tests
        run: |
          make test

      - name: Build All Binaries
        run: |
          make build-all

      - name: Verify Reference Documentation
        run: |
          make verify-docs

      - name: Verify Hugo Site Build
        working-directory: site
        run: |
          hugo --minify
