name: Agent Images

on:
  push:
    branches: [main]
    paths:
      - 'images/agent-*/**'
      - '.github/workflows/agent-images.yml'
  pull_request:
    branches: [main]
    paths:
      - 'images/agent-*/**'
      - '.github/workflows/agent-images.yml'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Publish Agent Images
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Target Platforms
        id: platforms
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
            {
              echo "base_tags<<TAGS"
              echo "localhost:5000/buddy-sandboxes-base:latest"
              echo "ghcr.io/hoangndst/buddy-sandboxes-base:latest"
              echo "ghcr.io/hoangndst/buddy-sandboxes-base:sha-${{ github.sha }}"
              echo "TAGS"
            } >> "$GITHUB_OUTPUT"
          else
            echo "platforms=linux/amd64" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
            {
              echo "base_tags<<TAGS"
              echo "localhost:5000/buddy-sandboxes-base:latest"
              echo "TAGS"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build and Push Base Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/agent-base/Dockerfile
          platforms: ${{ steps.platforms.outputs.platforms }}
          push: true
          tags: ${{ steps.platforms.outputs.base_tags }}

      - name: Build and Push Codex Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/agent-codex/Dockerfile
          build-contexts: |
            ghcr.io/hoangndst/buddy-sandboxes-base:latest=docker-image://localhost:5000/buddy-sandboxes-base:latest
            buddy-sandboxes-base:local=docker-image://localhost:5000/buddy-sandboxes-base:latest
          build-args: |
            BASE_IMAGE=ghcr.io/hoangndst/buddy-sandboxes-base:latest
          platforms: ${{ steps.platforms.outputs.platforms }}
          push: ${{ steps.platforms.outputs.push }}
          tags: |
            ghcr.io/hoangndst/buddy-sandboxes-codex:0.171.0
            ghcr.io/hoangndst/buddy-sandboxes-codex:sha-${{ github.sha }}
            ghcr.io/hoangndst/buddy-sandboxes-codex:latest

      - name: Build and Push Claude Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/agent-claude/Dockerfile
          build-contexts: |
            ghcr.io/hoangndst/buddy-sandboxes-base:latest=docker-image://localhost:5000/buddy-sandboxes-base:latest
            buddy-sandboxes-base:local=docker-image://localhost:5000/buddy-sandboxes-base:latest
          build-args: |
            BASE_IMAGE=ghcr.io/hoangndst/buddy-sandboxes-base:latest
          platforms: ${{ steps.platforms.outputs.platforms }}
          push: ${{ steps.platforms.outputs.push }}
          tags: |
            ghcr.io/hoangndst/buddy-sandboxes-claude-code:2.1.330
            ghcr.io/hoangndst/buddy-sandboxes-claude-code:sha-${{ github.sha }}
            ghcr.io/hoangndst/buddy-sandboxes-claude-code:latest
