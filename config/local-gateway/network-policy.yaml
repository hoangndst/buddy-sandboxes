apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: buddy-api
  namespace: buddy-sandboxes-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: buddy-api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          sandboxes.buddy.io/tenant: enabled
      podSelector:
        matchLabels:
          sandboxes.buddy.io/api-broker: "true"
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: buddy-sandboxes-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: buddy-egress-gateway
    ports:
    - protocol: TCP
      port: 8080
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: buddy-postgres
    ports:
    - protocol: TCP
      port: 5432
