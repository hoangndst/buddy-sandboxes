apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: buddy-api-sandbox-access
rules:
- apiGroups: ["sandboxes.buddy.io"]
  resources: ["sandboxes"]
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["pods/exec", "pods/portforward"]
  verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: buddy-api-tokenreview
rules:
- apiGroups: ["authentication.k8s.io"]
  resources: ["tokenreviews"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: buddy-api-tokenreview
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: buddy-api-tokenreview
subjects:
- kind: ServiceAccount
  name: buddy-api
  namespace: buddy-sandboxes-system
