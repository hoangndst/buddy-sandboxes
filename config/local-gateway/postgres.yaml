apiVersion: v1
kind: Service
metadata:
  name: buddy-postgres
  namespace: buddy-sandboxes-system
spec:
  selector:
    app.kubernetes.io/name: buddy-postgres
  ports:
  - name: postgres
    port: 5432
    targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: buddy-postgres
  namespace: buddy-sandboxes-system
spec:
  serviceName: buddy-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: buddy-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buddy-postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: postgres
        image: postgres:16.6-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - name: postgres
          containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: buddy
        - name: POSTGRES_USER
          value: buddy
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: buddy-postgres
              key: password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 70
          runAsGroup: 70
          capabilities:
            drop: ["ALL"]
        readinessProbe:
          exec:
            command: ["sh", "-c", "pg_isready -U buddy -d buddy"]
          periodSeconds: 5
        livenessProbe:
          exec:
            command: ["sh", "-c", "pg_isready -U buddy -d buddy"]
          initialDelaySeconds: 20
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 5Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: buddy-postgres
  namespace: buddy-sandboxes-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: buddy-postgres
  policyTypes: ["Ingress", "Egress"]
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: buddy-api
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: buddy-api-migrate
    ports:
    - protocol: TCP
      port: 5432
