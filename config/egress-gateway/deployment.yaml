apiVersion: apps/v1
kind: Deployment
metadata:
  name: egress-gateway
  labels:
    app.kubernetes.io/name: buddy-egress-gateway
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: buddy-egress-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buddy-egress-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: gateway
        image: controller:latest
        imagePullPolicy: IfNotPresent
        command:
        - /buddy-egress-gateway
        args:
        - --addr=:8080
        env:
        - name: EGRESS_GATEWAY_HMAC_SECRET
          valueFrom:
            secretKeyRef:
              name: egress-gateway-secret
              key: hmac-secret
        ports:
        - containerPort: 8080
          name: http-proxy
          protocol: TCP
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 1
          periodSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
