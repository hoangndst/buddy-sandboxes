apiVersion: v1
kind: Service
metadata:
  name: egress-gateway
  labels:
    app.kubernetes.io/name: buddy-egress-gateway
    app.kubernetes.io/managed-by: kustomize
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: buddy-egress-gateway
  ports:
  - port: 8080
    targetPort: 8080
    name: http-proxy
    protocol: TCP
