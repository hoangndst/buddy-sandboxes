apiVersion: v1
kind: Secret
metadata:
  name: egress-gateway-secret
  labels:
    app.kubernetes.io/name: buddy-egress-gateway
    app.kubernetes.io/managed-by: kustomize
type: Opaque
stringData:
  # 32-byte HMAC-SHA256 signing secret.
  # Replaced per installation with a random private key via 'make deploy' or 'make generate-gateway-secret'.
  hmac-secret: REPLACE_WITH_HMAC_SECRET_KEY_32BYTES
