---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims
  - pods
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - pods/status
  verbs:
  - get
- apiGroups:
  - ""
  resources:
  - serviceaccounts
  verbs:
  - create
  - get
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - node.k8s.io
  resources:
  - runtimeclasses
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - sandboxes.buddy.io
  resources:
  - networkprofiles
  - sandboxes
  - sandboxleases
  - sandboxpools
  - workspaces
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - sandboxes.buddy.io
  resources:
  - networkprofiles/finalizers
  - sandboxes/finalizers
  - sandboxleases/finalizers
  - sandboxpools/finalizers
  - workspaces/finalizers
  verbs:
  - update
- apiGroups:
  - sandboxes.buddy.io
  resources:
  - networkprofiles/status
  - sandboxes/status
  - sandboxleases/status
  - sandboxpools/status
  - workspaces/status
  verbs:
  - get
  - patch
  - update
